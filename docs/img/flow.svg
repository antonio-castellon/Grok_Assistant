<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>How a phrase moves through Grok Assistant</title>
  <desc>Microphone and keyboard stay local. Only a real question or a repaired order sends text to Grok.</desc>
  <rect width="1100" height="760" fill="#0e1418"/>
  <text x="40" y="42" fill="#f4f7f8" font-size="26" font-weight="650">How a phrase moves</text>
  <text x="40" y="68" fill="#9aafbb" font-size="15">Audio stops at the ear. The cloud receives text, and only when the rules agree.</text>

  <rect x="40" y="96" width="230" height="78" rx="14" fill="#1a242c" stroke="#314552"/>
  <text x="155" y="128" fill="#f4f7f8" font-size="18" text-anchor="middle" font-weight="650">Microphone</text>
  <text x="155" y="152" fill="#9aafbb" font-size="14" text-anchor="middle">open while it waits</text>

  <rect x="300" y="96" width="230" height="78" rx="14" fill="#1a242c" stroke="#314552"/>
  <text x="415" y="128" fill="#f4f7f8" font-size="18" text-anchor="middle" font-weight="650">Keyboard</text>
  <text x="415" y="152" fill="#9aafbb" font-size="14" text-anchor="middle">debug window</text>

  <rect x="620" y="96" width="440" height="78" rx="14" fill="#142824" stroke="#1f6f6a"/>
  <text x="840" y="128" fill="#f4f7f8" font-size="18" text-anchor="middle" font-weight="650">Local speech to text</text>
  <text x="840" y="152" fill="#b7d4cf" font-size="14" text-anchor="middle">Spanish. The recording never leaves.</text>

  <path d="M270 135 H300" stroke="#e8a030" stroke-width="2" fill="none"/>
  <path d="M530 135 H620" stroke="#e8a030" stroke-width="2" fill="none"/>
  <polygon points="616,130 628,135 616,140" fill="#e8a030"/>

  <rect x="330" y="214" width="440" height="72" rx="14" fill="#1a242c" stroke="#314552"/>
  <text x="550" y="244" fill="#f4f7f8" font-size="18" text-anchor="middle" font-weight="650">Finished phrase</text>
  <text x="550" y="268" fill="#9aafbb" font-size="14" text-anchor="middle">one line of text, after the pause</text>
  <path d="M840 174 V196 H550 V214" stroke="#e8a030" stroke-width="2" fill="none"/>
  <polygon points="544,210 550,222 556,210" fill="#e8a030"/>

  <rect x="250" y="326" width="600" height="86" rx="14" fill="#2a2114" stroke="#e8a030"/>
  <text x="550" y="360" fill="#f4f7f8" font-size="18" text-anchor="middle" font-weight="650">Rules, on this machine</text>
  <text x="550" y="386" fill="#f0d7a8" font-size="14" text-anchor="middle">wake · comando · song · goodbye · length · whose voice</text>
  <path d="M550 286 V326" stroke="#e8a030" stroke-width="2" fill="none"/>
  <polygon points="544,322 550,334 556,322" fill="#e8a030"/>

  <rect x="40" y="460" width="320" height="150" rx="14" fill="#1a242c" stroke="#314552"/>
  <text x="200" y="494" fill="#f4f7f8" font-size="18" text-anchor="middle" font-weight="650">Ignore</text>
  <text x="200" y="522" fill="#9aafbb" font-size="14" text-anchor="middle">ordinary talk in the room</text>
  <text x="200" y="548" fill="#9aafbb" font-size="14" text-anchor="middle">written in the local session</text>
  <text x="200" y="580" fill="#7f93a0" font-size="13" text-anchor="middle">nothing is sent</text>

  <rect x="390" y="460" width="320" height="150" rx="14" fill="#142824" stroke="#1f6f6a"/>
  <text x="550" y="494" fill="#f4f7f8" font-size="18" text-anchor="middle" font-weight="650">Local order</text>
  <text x="550" y="522" fill="#b7d4cf" font-size="14" text-anchor="middle">volume, voice, music, session</text>
  <text x="550" y="548" fill="#b7d4cf" font-size="14" text-anchor="middle">a garbled order is repaired,</text>
  <text x="550" y="572" fill="#b7d4cf" font-size="14" text-anchor="middle">then waits for sí</text>

  <rect x="740" y="460" width="320" height="150" rx="14" fill="#2a2114" stroke="#e8a030"/>
  <text x="900" y="494" fill="#f4f7f8" font-size="18" text-anchor="middle" font-weight="650">Question</text>
  <text x="900" y="522" fill="#f0d7a8" font-size="14" text-anchor="middle">text only, to your Grok account</text>
  <text x="900" y="548" fill="#f0d7a8" font-size="14" text-anchor="middle">web search, or an open agent</text>
  <text x="900" y="580" fill="#f0d7a8" font-size="14" text-anchor="middle">then a short spoken answer</text>

  <path d="M430 412 V438 H200 V460" stroke="#7f93a0" stroke-width="2" fill="none"/>
  <path d="M550 412 V460" stroke="#1f6f6a" stroke-width="2" fill="none"/>
  <path d="M670 412 V438 H900 V460" stroke="#e8a030" stroke-width="2" fill="none"/>
  <polygon points="194,456 200,468 206,456" fill="#7f93a0"/>
  <polygon points="544,456 550,468 556,456" fill="#1f6f6a"/>
  <polygon points="894,456 900,468 906,456" fill="#e8a030"/>

  <rect x="40" y="640" width="1020" height="88" rx="14" fill="#121c22" stroke="#314552"/>
  <text x="60" y="674" fill="#f4f7f8" font-size="16" font-weight="650">Around that path</text>
  <text x="60" y="702" fill="#9aafbb" font-size="15">Mouth: Windows speech or espeak, local. Ear closed while it talks, and while music plays.</text>
  <text x="60" y="724" fill="#9aafbb" font-size="15">Notebook on this PC. Agents on the Grok account. The tray is only the shell.</text>
</svg>
