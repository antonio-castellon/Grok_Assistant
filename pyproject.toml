[project]
name = "grok-assistant"
version = "0.1.0"
description = "A PC voice assistant that listens at home and only calls Grok on purpose."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pystray>=0.19",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grok-assistant = "grok_assistant.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grok_assistant = ["lines/*.txt", "lang/*.json", "ui/themes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
